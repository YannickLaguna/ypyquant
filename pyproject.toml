# pyproject.toml — Sistema_trading (monorepo desde 2026-11-16).
#
# Un solo repo con dos partes:
#   - src/ypyquant/: la librería instalable (lo que importan GrowSave y las pipelines).
#   - data/, db/, scripts/, tests/: el entorno de investigación y ejecución, que usa la librería.
# GrowSave instala solo la librería, con una versión fijada:
#   ypyquant @ git+https://github.com/YannickLaguna/ypyquant.git@vX.Y.Z
# Propósito del proyecto: nota de Obsidian «Sistema trading» (ver README.md).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ypyquant"
version = "0.4.0"
description = "Librería de lógica cuantitativa: optimización de portafolios, modelos de factores, backtesting, señales, ML financiero y ejecución"
readme = "docs/ypyquant.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "PyPortfolioOpt",
    "cvxpy>=1.4",
    "QuantLib>=1.40",
]

[project.optional-dependencies]
ml = ["tensorflow>=2.15"]
tracking = ["mlflow>=2.10"]
fast = ["vectorbt>=0.26"]
# Paper trading (pipelines/paper_trading + ypyquant.execution.nautilus). Opcional para que GrowSave no lo arrastre.
# nautilus_trader: GrowSave fija >=1.190; con Python 3.11 la última publicada compatible es 1.221.0 (2025-10-26).
# alpaca-py: <0.45 porque 0.45.0 (2026-11-05) tiene menos de 2 semanas.
trading = [
    "nautilus_trader>=1.190",
    "alpaca-py>=0.38,<0.45",
    "python-dotenv",
    "yfinance>=0.2",
]

# Dependencias del entorno (no de la librería): solo para trabajar en este repo
[dependency-groups]
entorno = [
    "yfinance>=0.2",
    "requests>=2.31",
    "lxml",
    "pyarrow",
    "duckdb",
    "pyyaml",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ypyquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Por defecto se saltan los tests que necesitan red o la antigua BD Supabase.
# Ejecutarlos: python -m pytest -m red   (o -m datos para la paridad con el TFM)
addopts = "-m 'not red and not datos'"
markers = [
    "red: necesita red (yfinance, FRED, Wikipedia, Kenneth French) o la BD Supabase (ya inexistente); se salta por defecto",
    "datos: necesita datos locales del TFM (TFM.db y parquet de rejilla_v2); se salta por defecto. Ejecutar: pytest -m datos",
]

[tool.ruff]
line-length = 120
target-version = "py311"
